<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Collection</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="home-page" class="page active">
        <div class="container">
            <h1>🎮 Game Collection</h1>
            <p class="subtitle">Choose a game to play</p>
            <div class="games-grid">
                <button class="game-card" onclick="navigateTo('tic-tac-toe')">
                    <div class="game-icon">⭕</div>
                    <h2>Tic Tac Toe</h2>
                    <p>Classic game for two players</p>
                </button>
                <button class="game-card" onclick="navigateTo('memory')">
                    <div class="game-icon">🧠</div>
                    <h2>Memory Game</h2>
                    <p>Match pairs and test your memory</p>
                </button>
                <button class="game-card" onclick="navigateTo('snake')">
                    <div class="game-icon">🐍</div>
                    <h2>Snake Game</h2>
                    <p>Eat food and grow longer</p>
                </button>
                <button class="game-card" onclick="navigateTo('rps')">
                    <div class="game-icon">✊</div>
                    <h2>Rock Paper Scissors</h2>
                    <p>Play against the computer</p>
                </button>
            </div>
        </div>
    </div>

    <div id="tic-tac-toe-page" class="page">
        <div class="container">
            <button class="back-btn" onclick="navigateTo('home')">← Back to Home</button>
            <h1>Tic Tac Toe</h1>
            
            <div class="game-info">
                <div class="player-info">
                    <span id="current-player">Player: X</span>
                </div>
                <button class="reset-btn" onclick="resetGame()">New Game</button>
            </div>

            <div class="game-board">
                <div class="cell" onclick="makeMove(0)"></div>
                <div class="cell" onclick="makeMove(1)"></div>
                <div class="cell" onclick="makeMove(2)"></div>
                <div class="cell" onclick="makeMove(3)"></div>
                <div class="cell" onclick="makeMove(4)"></div>
                <div class="cell" onclick="makeMove(5)"></div>
                <div class="cell" onclick="makeMove(6)"></div>
                <div class="cell" onclick="makeMove(7)"></div>
                <div class="cell" onclick="makeMove(8)"></div>
            </div>

            <div id="game-status" class="game-status"></div>
        </div>
    </div>

    <div id="memory-page" class="page">
        <div class="container">
            <button class="back-btn" onclick="navigateTo('home')">← Back to Home</button>
            <h1>Memory Game</h1>
            
            <div class="game-info">
                <div class="player-info">
                    <span id="moves-counter">Moves: 0</span>
                </div>
                <button class="reset-btn" onclick="resetMemoryGame()">New Game</button>
            </div>

            <div class="memory-board" id="memory-board"></div>
            <div id="memory-status" class="game-status"></div>
        </div>
    </div>

    <div id="snake-page" class="page">
        <div class="container">
            <button class="back-btn" onclick="navigateTo('home')">← Back to Home</button>
            <h1>Snake Game</h1>
            
            <div class="game-info">
                <div class="player-info">
                    <span id="snake-score">Score: 0</span>
                </div>
                <button class="reset-btn" onclick="resetSnakeGame()">New Game</button>
            </div>

            <canvas id="snake-canvas"></canvas>
            <div id="snake-status" class="game-status"></div>
            <p class="instructions">Use arrow keys to control the snake</p>
        </div>
    </div>

    <div id="rps-page" class="page">
        <div class="container">
            <button class="back-btn" onclick="navigateTo('home')">← Back to Home</button>
            <h1>Rock Paper Scissors</h1>
            
            <div class="game-info">
                <div class="player-info">
                    <span id="rps-score">You: 0 | Computer: 0</span>
                </div>
                <button class="reset-btn" onclick="resetRPSGame()">Reset Score</button>
            </div>

            <div class="rps-game">
                <div class="rps-section">
                    <p>Your Choice</p>
                    <div id="player-choice" class="choice-display">-</div>
                </div>
                <div class="rps-section">
                    <p>Computer's Choice</p>
                    <div id="computer-choice" class="choice-display">-</div>
                </div>
            </div>

            <div class="rps-buttons">
                <button class="choice-btn" onclick="playRPS('rock')">🪨 Rock</button>
                <button class="choice-btn" onclick="playRPS('paper')">📄 Paper</button>
                <button class="choice-btn" onclick="playRPS('scissors')">✂️ Scissors</button>
            </div>

            <div id="rps-result" class="game-status"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
